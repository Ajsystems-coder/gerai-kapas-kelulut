:root{
  --primary:#FF4D2E;
  --primary-dark:#F43F2A;
  --primary-soft:#FFF0EB;
  --primary-soft2:#FFE8E0;
  --bg:#FFF7F3;
  --app-bg:#FFF7F3;
  --surface:#FFFFFF;
  --surface2:#FFF1EC;
  --text:#1B1513;
  --muted:#8A7D78;
  --line:#F1E4DE;
  --card-shadow:0 14px 36px rgba(255,77,46,.08), 0 2px 8px rgba(27,21,19,.04);
  --safe-area-inset-top:0px;
}

[data-theme="dark"]{
  --bg:#171110;
  --app-bg:#171110;
  --surface:#241C19;
  --surface2:#32251F;
  --text:#FFF4EF;
  --muted:#C2AFA8;
  --line:#3D2F29;
  --primary-soft:#3A231D;
  --primary-soft2:#47291F;
  --card-shadow:0 14px 36px rgba(0,0,0,.35);
}

*{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif
}

.font-display{
  font-family:'Fraunces',Georgia,serif
}

html,body{
  overflow-x:clip
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text)
}

button{
  cursor:pointer
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%, transparent)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.card-shadow{
  box-shadow:var(--card-shadow)
}

.range{
  accent-color:var(--primary)
}

.tap-target{
  min-height:44px;
  min-width:44px
}

.gradient-header{
  background:linear-gradient(135deg,var(--primary) 0%,#FF8A3D 48%,#7C3AED 100%)
}

.gradient-soft{
  background:linear-gradient(135deg,#FFF0EB 0%,#FFE4F1 55%,#EAF6FF 100%)
}

@media (max-width:639px){
  button{
    min-height:36px;
  }

  .tap-target{
    min-height:44px;
    min-width:44px;
  }
}

@media (min-width:1920px){
  .monitor-pad{
    padding-left:2rem;
    padding-right:2rem;
  }
}

@media print{
  body{
    background:#fff !important;
    color:#000 !important
  }

  body *{
    visibility:hidden
  }

  .print-overlay{
    position:static !important;
    overflow:visible !important;
    background:#fff !important;
    padding:0 !important;
    margin:0 !important
  }

  .print-overlay > *{
    min-height:0 !important
  }

  .print-area,.print-area *{
    visibility:visible
  }

  .print-area{
    position:absolute !important;
    left:0 !important;
    top:0 !important;
    width:100% !important;
    max-width:none !important;
    border:none !important;
    box-shadow:none !important;
    border-radius:0 !important;
    padding:24px !important;
    background:#fff !important;
    color:#000 !important
  }

  .no-print{
    display:none !important
  }
}
